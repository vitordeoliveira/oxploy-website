# Builds the site when a version tag is pushed, and publishes it as a release, as oxploy
# deploys it: for each machine, the binary with the assets folder it loads, such as
# oxploy-website-x86_64-linux.tar.gz for a server, and oxploy-website-aarch64-macos.tar.gz
# for trying it on a Mac.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          # An older Ubuntu, so the binary also runs where glibc is older than on the runner.
          - runner: ubuntu-22.04
            machine: x86_64-linux
          - runner: macos-latest
            machine: aarch64-macos
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tag against the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      # It writes the files the binary declares with `asset!`, which it loads at runtime.
      - name: Install the Topcoat CLI
        run: cargo install topcoat-cli --version 0.11.0 --locked

      - name: Build
        run: cargo build --release --locked

      - name: Bundle the assets
        run: topcoat asset bundle --release

      - name: Package
        run: |
          file=oxploy-website-${{ matrix.machine }}.tar.gz
          tar czf "$file" -C target/release oxploy-website assets
          shasum -a 256 "$file" > "$file.sha256"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.machine }}
          path: oxploy-website-${{ matrix.machine }}.tar.gz*
          if-no-files-found: error

  # One release with every machine's files, once all of them are built.
  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --repo "$GITHUB_REPOSITORY"
          --title "oxploy website $GITHUB_REF_NAME" --generate-notes
