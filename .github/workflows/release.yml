# Builds the site when a version tag is pushed, and publishes it as a release, as oxploy
# deploys it: for each machine, the binary with the assets folder it loads, such as
# oxploy-website-x86_64-linux.tar.gz for a server, and oxploy-website-aarch64-macos.tar.gz
# for trying it on a Mac.
#
# Each build adds its files to the release as soon as it is done, so a slow one, such
# as a Mac waiting for a machine, does not hold the others back.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      # A build that fails leaves the others to finish and publish.
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the binary also runs where glibc is older than on the runner.
          - runner: ubuntu-22.04
            machine: x86_64-linux
          - runner: macos-latest
            machine: aarch64-macos
    runs-on: ${{ matrix.runner }}
    env:
      FILE: oxploy-website-${{ matrix.machine }}.tar.gz
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable

      - name: Check the tag against the version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      - uses: Swatinem/rust-cache@v2

      # It writes the files the binary declares with `asset!`, which it loads at runtime.
      - name: Install the Topcoat CLI
        run: cargo install topcoat-cli --version 0.11.0 --locked

      - name: Build
        run: cargo build --release --locked

      - name: Bundle the assets
        run: topcoat asset bundle --release

      - name: Package
        run: |
          tar czf "$FILE" -C target/release oxploy-website assets
          shasum -a 256 "$FILE" > "$FILE.sha256"

      - name: Publish to the release
        run: |
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # Both builds may get here at once: one makes the release, and the other
            # finds it made.
            gh release create "$GITHUB_REF_NAME" --title "oxploy website $GITHUB_REF_NAME" --generate-notes \
              || gh release view "$GITHUB_REF_NAME" > /dev/null
          fi
          # The checksum first, so it is there by the time oxploy sees the file.
          gh release upload "$GITHUB_REF_NAME" "$FILE.sha256" --clobber
          gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
