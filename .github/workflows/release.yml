# Builds the site when a version tag is pushed, and publishes it as a release, as oxploy
# deploys it: oxploy-website-x86_64-linux.tar.gz, the binary with the assets folder it
# loads, for a Linux server.
#
# A run on a tag can only read caches saved on that tag or on main, so a push to main that
# changes the dependencies or this workflow builds without publishing, to save the caches
# the next tags read. GitHub deletes a cache after 7 days without use.
name: Release

on:
  push:
    branches: [main]
    # GitHub ignores the paths for a tag, so every version tag runs.
    paths: [Cargo.lock, .github/workflows/release.yml]
    tags: ["v*"]

permissions:
  contents: write

env:
  TOPCOAT_CLI_VERSION: 0.11.0

jobs:
  build:
    # An older Ubuntu, so the binary also runs where glibc is older than on the runner.
    runs-on: ubuntu-22.04
    env:
      FILE: oxploy-website-x86_64-linux.tar.gz
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7

      # A fixed version, because the dependency cache is keyed by it: changing it here
      # also runs this workflow on main, which saves a cache for the new version.
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal && rustup default 1.99.1

      - name: Check the tag against the version
        if: github.ref_type == 'tag'
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match version $version in Cargo.toml" >&2
            exit 1
          fi

      # Only main saves it, since no other tag could read a tag's cache. The Topcoat CLI
      # has its own cache below.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # The CLI writes the files the binary declares with `asset!`, which it loads at
      # runtime. It takes minutes to build, so main keeps it by its version.
      - name: Restore the Topcoat CLI
        id: topcoat-cli
        uses: actions/cache/restore@v6
        with:
          path: ~/.cargo/bin/topcoat
          key: topcoat-cli-${{ env.TOPCOAT_CLI_VERSION }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install the Topcoat CLI
        if: steps.topcoat-cli.outputs.cache-hit != 'true'
        run: cargo install topcoat-cli --version "$TOPCOAT_CLI_VERSION" --locked

      - name: Save the Topcoat CLI
        if: steps.topcoat-cli.outputs.cache-hit != 'true' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@v6
        with:
          path: ~/.cargo/bin/topcoat
          key: ${{ steps.topcoat-cli.outputs.cache-primary-key }}

      - name: Build
        run: cargo build --release --locked

      - name: Bundle the assets
        if: github.ref_type == 'tag'
        run: topcoat asset bundle --release

      - name: Package
        if: github.ref_type == 'tag'
        run: |
          tar czf "$FILE" -C target/release oxploy-website assets
          sha256sum "$FILE" > "$FILE.sha256"

      - name: Publish to the release
        if: github.ref_type == 'tag'
        run: |
          # A rerun finds the release already made.
          if ! gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "oxploy website $GITHUB_REF_NAME" --generate-notes
          fi
          # The checksum first, so it is there by the time oxploy sees the file.
          gh release upload "$GITHUB_REF_NAME" "$FILE.sha256" --clobber
          gh release upload "$GITHUB_REF_NAME" "$FILE" --clobber
